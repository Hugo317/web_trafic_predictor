[project]
name = "web-trafic-predictor"
version = "0.1.0"
description = "Wikipedia web-traffic time-series forecasting with GRU models in PyTorch"
readme = "README.md"
authors = [
    { name = "Hugo Caravlho", email = "hugomnc317@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "scikit-learn>=1.9.1",
    "torch>=2.14.0",
]

[project.scripts]
web-trafic-predictor = "web_trafic_predictor:main"

[build-system]
requires = ["uv_build>=0.12.12,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "jupyterlab>=4.6.4",
    "kaggle>=2.2.4",
]
